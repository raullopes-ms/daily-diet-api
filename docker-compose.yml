services:
  postgres:
    image: bitnami/postgresql
    container_name: diet_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: diet
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: